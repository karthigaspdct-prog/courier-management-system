<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courier Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📦 Courier Management System</h1>
    <nav>
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="book">Book Courier</button>
      <button class="tab" data-tab="track">Track</button>
    </nav>
  </header>

  <main>
    <!-- Dashboard -->
    <section id="dashboard" class="panel active">
      <div class="stats">
        <div class="card"><span id="statTotal">0</span><p>Total</p></div>
        <div class="card"><span id="statTransit">0</span><p>In Progress</p></div>
        <div class="card"><span id="statDelivered">0</span><p>Delivered</p></div>
        <div class="card"><span id="statRevenue">₹0</span><p>Revenue</p></div>
      </div>
      <input type="search" id="search" placeholder="Search by ID, sender, receiver...">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Sender</th><th>Receiver</th><th>Route</th><th>Type</th><th>Cost</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="courierBody"></tbody>
        </table>
        <p id="emptyMsg" class="muted">No couriers yet. Book one from the "Book Courier" tab.</p>
      </div>
    </section>

    <!-- Book -->
    <section id="book" class="panel">
      <form id="bookForm">
        <div class="grid">
          <label>Sender Name<input name="sender" required></label>
          <label>Sender Phone<input name="senderPhone" pattern="[0-9]{10}" title="10 digit number" required></label>
          <label>Receiver Name<input name="receiver" required></label>
          <label>Receiver Phone<input name="receiverPhone" pattern="[0-9]{10}" title="10 digit number" required></label>
          <label>From City<input name="from" required></label>
          <label>To City<input name="to" required></label>
          <label>Weight (kg)<input name="weight" type="number" min="0.1" step="0.1" required></label>
          <label>Service Type
            <select name="type">
              <option>Standard</option>
              <option>Express</option>
              <option>Overnight</option>
            </select>
          </label>
        </div>
        <p class="estimate">Estimated cost: <strong id="estimate">₹0</strong></p>
        <button type="submit" class="primary">Book Courier</button>
      </form>
      <p id="bookMsg" class="success"></p>
    </section>

    <!-- Track -->
    <section id="track" class="panel">
      <form id="trackForm" class="inline">
        <input id="trackId" placeholder="Enter Tracking ID (e.g. CMS12345678)" required>
        <button type="submit" class="primary">Track</button>
      </form>
      <div id="trackResult"></div>
    </section>
  </main>

  <footer>Made with HTML, CSS &amp; JavaScript • Data is saved in your browser (localStorage)</footer>
  <script src="script.js"></script>
</body>
</html>
